<!DOCTYPE html>
<html>
<head>
    <title>Smart Feedback System</title>
</head>
<body>
    <h2>Restaurant Feedback Sentiment Analysis</h2>
    <form method="POST">
        <textarea name="review" rows="5" cols="50" placeholder="Enter customer review..."></textarea><br><br>
        <input type="submit" value="Analyze">
    </form>
    {% if result %}
        <h3>Sentiment: {{ result }}</h3>
    {% endif %}
</body>
</html>
